name: Compilar Firmware ESP32

on:
  push:
    tags:
      - 'v*'              # cria release a cada tag v1.0.0, v1.0.1, ...
  workflow_dispatch:       # também permite compilar manualmente (aba Actions)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # precisa para criar o Release e anexar o .bin

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Instalar arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Adicionar core ESP32 e bibliotecas
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11

      - name: Compilar firmware
        run: |
          mkdir -p dist
          arduino-cli compile --fqbn esp32:esp32:esp32 tenis_de_mesa/tenis_de_mesa.ino --output-dir dist
          cp dist/tenis_de_mesa.ino.bin dist/firmware.bin

      - name: Criar/atualizar Release e anexar firmware.bin
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/firmware.bin
          generate_release_notes: true